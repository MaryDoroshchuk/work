<li>у зміні робочої позиції для робочої або синьої карти</li>`,
 cardTitle:"Що таке робоча карта",
 cardText:`<p>Робоча карта (zaměstnanecká karta) — це дозвіл на довгострокове проживання в Чехії з метою працевлаштування. Вона поєднує право на проживання і право на роботу.</p>
<p>Власник карти має право перебувати на території ЧР і працювати на посаді, для якої карту видано. За згодою відділу політики притулку і міграції МВС посаду можна змінити або працювати додатково в іншого роботодавця.</p>
<p>Для видачі потрібен трудовий договір, договір про робочу діяльність або договір про намір, у якому сторони зобовʼязуються укласти такий договір. Місячна зарплата не може бути нижчою за базову ставку мінімальної зарплати, а робочий тиждень має становити щонайменше 15 годин.</p>

<p>Držitel je oprávněn pobývat na území ČR a pracovat na pracovním místě, na které byla karta vydána. Se souhlasem odboru azylové a migrační politiky MV lze místo změnit nebo pracovat na dalším místě či u dalšího zaměstnavatele.</p>
<p>Pro vydání je nezbytná pracovní smlouva, dohoda o pracovní činnosti nebo smlouva o smlouvě budoucí. Měsíční mzda nesmí být nižší než základní sazba měsíční minimální mzdy a týdenní pracovní doba musí činit nejméně 15 hodin.</p>

 cardText:`<p>Cardul de angajare (zaměstnanecká karta) este un permis de ședere de lungă durată în Cehia în scop de muncă. Reunește dreptul de ședere și dreptul de a lucra.</p>
<p>Titularul are dreptul să locuiască în Cehia și să lucreze pe postul pentru care a fost emis cardul. Cu acordul departamentului de politici de azil și migrație, postul poate fi schimbat sau se poate lucra suplimentar la alt angajator.</p>
<p>Pentru emitere este necesar un contract de muncă, un contract de activitate sau un antecontract. Salariul lunar nu poate fi mai mic decât salariul minim de bază, iar programul săptămânal trebuie să fie de cel puțin 15 ore.</p>
