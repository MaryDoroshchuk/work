<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Політика обробки персональних даних</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414;
  --yellow:#FFC400;
  --paper:#FBFAF7;
  --body:#54524D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Manrope,system-ui,sans-serif;font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.15}
p,ul{margin:0}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}

.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.bar .wrap{display:flex;align-items:center;height:56px;gap:10px}
.mark{font-weight:800;font-size:16px;text-decoration:none}
.mark em{font-style:normal;color:var(--yellow)}
.langs{margin-left:auto;display:flex;gap:4px}
.langs button{font:600 13px/1 Manrope,sans-serif;background:#242424;color:#A5A29B;border:0;
  padding:9px 12px;border-radius:8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.hazard{height:9px;background:repeating-linear-gradient(135deg,var(--yellow) 0 16px,var(--ink) 16px 32px)}

header{padding:38px 0 6px}
h1{font-size:clamp(28px,7vw,40px)}
.updated{color:var(--body);font-size:15px;margin-top:12px}

main{padding:14px 0 40px}
main h2{font-size:20px;margin:34px 0 10px;padding-top:18px;border-top:2px solid var(--ink)}
main p+p{margin-top:12px}
main ul{padding-left:20px;margin-top:10px}
main li{margin-bottom:7px}
main .note{color:var(--body);font-size:15px}
.fill{background:var(--yellow);padding:1px 6px;border-radius:5px;font-weight:600;white-space:nowrap}
.card{border:2px solid var(--ink);border-radius:16px;padding:18px;background:#fff;margin-top:14px}
.card p+p{margin-top:6px}

.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;
  border:2px solid var(--ink);border-radius:14px;padding:14px 20px;margin-top:8px}
.back:hover{background:var(--ink);color:#fff}
footer{border-top:2px solid var(--ink);padding:22px 0 40px;color:var(--body);font-size:13px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <a class="mark" href="index.html">AUTO<em>PARTS</em></a>
  <div class="langs" role="group">
    <button data-lang="uk" aria-pressed="true">UA</button>
    <button data-lang="cs" aria-pressed="false">CZ</button>
    <button data-lang="ro" aria-pressed="false">RO</button>
  </div>
</div></div>
<div class="hazard"></div>

<header><div class="wrap">
  <h1 id="pTitle"></h1>

<main><div class="wrap" id="doc"></div></main>

<div class="wrap"><a class="back" href="index.html" id="pBack"></a></div>

<footer><div class="wrap"><p id="pFoot"></p></div></footer>

function apply(l){
  document.documentElement.lang = l;
  document.getElementById("pTitle").textContent = M[l].title;
  document.getElementById("pUpdated").innerHTML = M[l].updated;
  document.getElementById("pBack").textContent = M[l].back;
  document.getElementById("pFoot").innerHTML = M[l].foot;
  document.getElementById("doc").innerHTML = DOC[l];
  document.querySelectorAll(".langs button").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.lang===l ? "true":"false"));
  document.title = M[l].title;
}
document.querySelectorAll(".langs button").forEach(b=>
  b.addEventListener("click",()=>apply(b.dataset.lang)));
const nav=(navigator.language||"uk").slice(0,2);
apply(["uk","cs","ro"].includes(nav)?nav:"uk");
</script>
