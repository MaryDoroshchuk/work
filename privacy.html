  "h1": "Політика обробки персональних даних",
  "updated": "Останнє оновлення: <span class=\"fill\">[дата]</span>",
  "doc": "\n<h2>1. Хто обробляє ваші дані</h2>\n<p>Адміністратором (správce) персональних даних є <b>Palsir CZ s.r.o.</b>, IČO 04383249, Klostermannova 5987, 430 01 Chomutov, Чеська Республіка.</p>\n<p>Ліцензія на посередництво в працевлаштуванні № <span class=\"fill\">[номер]</span>, видана Úřad práce ČR.</p>\n<p>Email: PalsirCz@email.cz &nbsp;·&nbsp; Телефон: +420 608 067 777</p>\n\n<h2>2. Які дані ми збираємо</h2>\n<p>Через форму на сайті ми отримуємо дані, які ви вводите самі: імʼя або назву компанії, номер телефону, email, обраний спосіб звʼязку і текст повідомлення.</p>\n<p>Якщо ви пишете нам у Telegram, Viber або WhatsApp, ми обробляємо дані, які ви надсилаєте в переписці.</p>\n<p>Ми не запитуємо особливі категорії даних — стан здоровʼя, віросповідання, походження, судимість. Не вказуйте їх у повідомленні.</p>\n\n<h2>3. Навіщо і на якій підставі</h2>\n<ul>\n<li><b>Розгляд звернення та звʼязок з вами.</b> Підстава — ваша згода (ст. 6(1)(a) GDPR) і вжиття заходів на ваш запит перед укладенням договору (ст. 6(1)(b) GDPR).</li>\n<li><b>Передача кандидатури роботодавцю.</b> Підстава — ваша згода.</li>\n</ul>\n<p>Надання даних добровільне, але без імені та телефону ми не зможемо опрацювати звернення.</p>\n\n<h2>4. Кому передаємо</h2>\n<ul>\n<li>роботодавцям, до яких ми підбираємо персонал;</li>\n<li>постачальнику сервісу обробки форм <span class=\"fill\">[Formspree Inc., США]</span>;</li>\n<li>постачальнику хостингу <span class=\"fill\">[GitHub Inc., США]</span>;</li>\n<li>державним органам — якщо цього вимагає закон.</li>\n</ul>\n<p>Передача за межі ЄС відбувається на підставі <span class=\"fill\">[EU–US Data Privacy Framework або стандартних договірних положень]</span>. Ми не продаємо ваші дані і не передаємо їх для реклами.</p>\n\n<h2>5. Скільки зберігаємо</h2>\n<p>Дані зі звернення зберігаємо <span class=\"fill\">[6 місяців]</span> з моменту надсилання. Якщо ви влаштуєтеся на роботу, строк визначається трудовим і податковим законодавством ЧР. Після відкликання згоди видаляємо дані без зайвої затримки, окрім випадків, коли закон зобовʼязує їх зберігати.</p>\n\n<h2>6. Ваші права</h2>\n<ul>\n<li>доступ до даних і копія;</li>\n<li>виправлення неточних даних;</li>\n<li>видалення даних;</li>\n<li>обмеження обробки;</li>\n<li>перенесення даних;</li>\n<li>заперечення проти обробки;</li>\n<li>відкликання згоди в будь-який момент — це не впливає на законність обробки до відкликання.</li>\n</ul>\n<p>Щоб скористатися правами, напишіть на PalsirCz@email.cz. Відповідаємо протягом одного місяця.</p>\n<p>Скарга: Úřad pro ochranu osobních údajů, Pplk. Sochora 27, 170 00 Praha 7, uoou.cz</p>\n\n<h2>7. Cookies, мапа та шрифти</h2>\n<p>Сайт не використовує cookies для відстеження відвідувачів.</p>\n<p>Мапа на сторінці контактів завантажується з OpenStreetMap. Цей сервіс не встановлює рекламних файлів cookie і не використовує ваші дані для профілювання.</p>\n<p>Шрифти завантажуються із сервісу Google Fonts, тому Google може отримати вашу IP-адресу.</p>\n<p class=\"note\"><span class=\"fill\">[Якщо додасте Google Analytics або Meta Pixel — цей розділ треба переписати і додати банер згоди.]</span></p>\n\n<h2>8. Автоматизоване прийняття рішень</h2>\n<p>Не використовуємо автоматизоване прийняття рішень і профілювання. Рішення щодо кандидатів приймають люди.</p>\n\n<h2>9. Зміни цієї політики</h2>\n<p>Актуальна версія завжди опублікована на цій сторінці із зазначенням дати оновлення.</p>\n"
 },
 "cs": {
  "h1": "Zásady zpracování osobních údajů",
  "updated": "Poslední aktualizace: <span class=\"fill\">[datum]</span>",
  "doc": "\n<h2>1. Kdo zpracovává vaše údaje</h2>\n<p>Správcem osobních údajů je <b>Palsir CZ s.r.o.</b>, IČO 04383249, Klostermannova 5987, 430 01 Chomutov, Česká republika.</p>\n<p>Povolení ke zprostředkování zaměstnání č. <span class=\"fill\">[číslo]</span>, vydané Úřadem práce ČR.</p>\n<p>E-mail: PalsirCz@email.cz &nbsp;·&nbsp; Telefon: +420 608 067 777</p>\n\n<h2>2. Jaké údaje shromažďujeme</h2>\n<p>Prostřednictvím formuláře získáváme údaje, které vyplníte sami: jméno nebo název firmy, telefonní číslo, e-mail, preferovaný způsob kontaktu a text zprávy.</p>\n<p>Pokud nám napíšete na Telegram, Viber nebo WhatsApp, zpracováváme údaje sdělené v konverzaci.</p>\n<p>Nevyžadujeme zvláštní kategorie údajů — zdravotní stav, náboženské vyznání, původ ani záznam v rejstříku trestů. Neuvádějte je prosím do zprávy.</p>\n\n<h2>3. Proč a na jakém právním základě</h2>\n<ul>\n<li><b>Vyřízení dotazu a kontaktování vás.</b> Právní základ — váš souhlas (čl. 6 odst. 1 písm. a) GDPR) a opatření na vaši žádost před uzavřením smlouvy (čl. 6 odst. 1 písm. b) GDPR).</li>\n<li><b>Předání kandidatury zaměstnavateli.</b> Právní základ — váš souhlas.</li>\n</ul>\n<p>Poskytnutí údajů je dobrovolné, bez jména a telefonu však dotaz nemůžeme vyřídit.</p>\n\n<h2>4. Komu údaje předáváme</h2>\n<ul>\n<li>zaměstnavatelům, pro které vyhledáváme pracovníky;</li>\n<li>poskytovateli služby zpracování formulářů <span class=\"fill\">[Formspree Inc., USA]</span>;</li>\n<li>poskytovateli hostingu <span class=\"fill\">[GitHub Inc., USA]</span>;</li>\n<li>orgánům veřejné moci, pokud to vyžaduje zákon.</li>\n</ul>\n<p>Předání mimo EU probíhá na základě <span class=\"fill\">[EU–US Data Privacy Framework nebo standardních smluvních doložek]</span>. Údaje neprodáváme ani nepředáváme pro reklamní účely.</p>\n\n<h2>5. Jak dlouho údaje uchováváme</h2>\n<p>Údaje z dotazu uchováváme <span class=\"fill\">[6 měsíců]</span> od odeslání. Pokud u nás nastoupíte, doba se řídí pracovněprávními a daňovými předpisy ČR. Po odvolání souhlasu údaje bez zbytečného odkladu vymažeme, s výjimkou případů, kdy nám zákon ukládá je uchovat.</p>\n\n<h2>6. Vaše práva</h2>\n<ul>\n<li>na přístup k údajům a jejich kopii;</li>\n<li>na opravu nepřesných údajů;</li>\n<li>na výmaz údajů;</li>\n<li>na omezení zpracování;</li>\n<li>na přenositelnost údajů;</li>\n<li>vznést námitku proti zpracování;</li>\n<li>odvolat souhlas kdykoli — tím není dotčena zákonnost zpracování před odvoláním.</li>\n</ul>\n<p>Práva uplatníte na PalsirCz@email.cz. Odpovídáme do jednoho měsíce.</p>\n<p>Stížnost: Úřad pro ochranu osobních údajů, Pplk. Sochora 27, 170 00 Praha 7, uoou.cz</p>\n\n<h2>7. Cookies, mapa a písma</h2>\n<p>Web nepoužívá cookies ke sledování návštěvníků.</p>\n<p>Mapa na stránce kontaktů se načítá z OpenStreetMap. Tato služba neukládá reklamní cookies ani nevyužívá vaše údaje k profilování.</p>\n<p>Písma se načítají ze služby Google Fonts, takže Google může získat vaši IP adresu.</p>\n<p class=\"note\"><span class=\"fill\">[Pokud přidáte Google Analytics nebo Meta Pixel, je nutné tuto část přepsat a doplnit cookies lištu.]</span></p>\n\n<h2>8. Automatizované rozhodování</h2>\n<p>Nepoužíváme automatizované rozhodování ani profilování. O kandidátech rozhodují lidé.</p>\n\n<h2>9. Změny těchto zásad</h2>\n<p>Aktuální znění je vždy zveřejněno na této stránce s datem poslední aktualizace.</p>\n"
 },
 "ro": {
  "h1": "Politica de prelucrare a datelor personale",
  "updated": "Ultima actualizare: <span class=\"fill\">[data]</span>",
  "doc": "\n<h2>1. Cine prelucrează datele dumneavoastră</h2>\n<p>Operatorul datelor cu caracter personal este <b>Palsir CZ s.r.o.</b>, IČO 04383249, Klostermannova 5987, 430 01 Chomutov, Republica Cehă.</p>\n<p>Licență de mediere a muncii nr. <span class=\"fill\">[număr]</span>, eliberată de Úřad práce ČR.</p>\n<p>E-mail: PalsirCz@email.cz &nbsp;·&nbsp; Telefon: +420 608 067 777</p>\n\n<h2>2. Ce date colectăm</h2>\n<p>Prin formular primim datele pe care le completați: numele sau denumirea companiei, numărul de telefon, e-mailul, modalitatea de contact preferată și textul mesajului.</p>\n<p>Dacă ne scrieți pe Telegram, Viber sau WhatsApp, prelucrăm datele transmise în conversație.</p>\n<p>Nu solicităm categorii speciale de date — starea de sănătate, religia, originea sau cazierul judiciar. Vă rugăm să nu le menționați în mesaj.</p>\n\n<h2>3. De ce și în ce temei</h2>\n<ul>\n<li><b>Soluționarea solicitării și contactarea dumneavoastră.</b> Temei — consimțământul (art. 6 alin. 1 lit. a) GDPR) și măsurile luate la cererea dumneavoastră înainte de încheierea contractului (art. 6 alin. 1 lit. b) GDPR).</li>\n<li><b>Transmiterea candidaturii către angajator.</b> Temei — consimțământul dumneavoastră.</li>\n</ul>\n<p>Furnizarea datelor este voluntară, însă fără nume și telefon nu putem soluționa solicitarea.</p>\n\n<h2>4. Cui transmitem datele</h2>\n<ul>\n<li>angajatorilor pentru care recrutăm personal;</li>\n<li>furnizorului serviciului de formulare <span class=\"fill\">[Formspree Inc., SUA]</span>;</li>\n<li>furnizorului de găzduire <span class=\"fill\">[GitHub Inc., SUA]</span>;</li>\n<li>autorităților publice, dacă legea o cere.</li>\n</ul>\n<p>Transferul în afara UE se realizează în temeiul <span class=\"fill\">[EU–US Data Privacy Framework sau al clauzelor contractuale standard]</span>. Nu vindem datele și nu le transmitem în scopuri publicitare.</p>\n\n<h2>5. Cât timp păstrăm datele</h2>\n<p>Datele din solicitare se păstrează <span class=\"fill\">[6 luni]</span> de la trimitere. Dacă vă angajați, durata este stabilită de legislația muncii și fiscală din Cehia. După retragerea consimțământului ștergem datele fără întârziere, cu excepția cazurilor în care legea ne obligă să le păstrăm.</p>\n\n<h2>6. Drepturile dumneavoastră</h2>\n<ul>\n<li>dreptul de acces la date și la o copie;</li>\n<li>dreptul la rectificarea datelor inexacte;</li>\n<li>dreptul la ștergerea datelor;</li>\n<li>dreptul la restricționarea prelucrării;</li>\n<li>dreptul la portabilitatea datelor;</li>\n<li>dreptul de a vă opune prelucrării;</li>\n<li>dreptul de a retrage consimțământul oricând — fără a afecta legalitatea prelucrării anterioare.</li>\n</ul>\n<p>Pentru exercitarea drepturilor scrieți la PalsirCz@email.cz. Răspundem în termen de o lună.</p>\n<p>Plângere: Úřad pro ochranu osobních údajů, Pplk. Sochora 27, 170 00 Praha 7, uoou.cz</p>\n\n<h2>7. Cookie-uri, hartă și fonturi</h2>\n<p>Site-ul nu folosește cookie-uri pentru urmărirea vizitatorilor.</p>\n<p>Harta de pe pagina de contact se încarcă de la OpenStreetMap. Acest serviciu nu setează cookie-uri publicitare și nu folosește datele dumneavoastră pentru profilare.</p>\n<p>Fonturile sunt încărcate din Google Fonts, astfel încât Google poate obține adresa dumneavoastră IP.</p>\n<p class=\"note\"><span class=\"fill\">[Dacă adăugați Google Analytics sau Meta Pixel, această secțiune trebuie rescrisă și adăugat un banner de consimțământ.]</span></p>\n\n<h2>8. Decizii automatizate</h2>\n<p>Nu folosim decizii automatizate și nici crearea de profiluri. Deciziile privind candidații sunt luate de oameni.</p>\n\n<h2>9. Modificări ale acestei politici</h2>\n<p>Versiunea curentă este întotdeauna publicată pe această pagină, cu data ultimei actualizări.</p>\n"
